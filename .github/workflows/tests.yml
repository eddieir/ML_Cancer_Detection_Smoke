name: tests

on:
  push:
    branches: [improve/valid-evaluation-and-training]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Every test in tests/ builds its own synthetic fixtures in-process
      # (see tests/test_preprocess_split_aware.py, tests/test_pipeline.py) —
      # no multi-gigabyte GEO/TCGA downloads happen here.
      - name: Run test suite
        run: python -m pytest tests/ -q
