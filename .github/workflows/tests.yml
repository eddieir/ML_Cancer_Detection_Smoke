name: tests

# Branch-independent triggers: this workflow must keep working regardless
# of which feature branch is currently checked out, so it targets `main`
# (not a hardcoded, temporary feature-branch name that goes stale the
# moment that branch is renamed or merged) plus an on-demand dispatch for
# manually re-running against any ref.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: "pip"
          # Included in the cache key so a change to either file busts the
          # cache instead of silently reusing a stale resolution.
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints-ci.txt

      - name: Record environment
        run: |
          python --version
          pip --version
          python -c "
          import importlib
          for pkg in ['numpy', 'pandas', 'scipy', 'sklearn', 'torch', 'scanpy', 'anndata', 'celltypist']:
              try:
                  print(pkg, importlib.metadata.version(pkg))
              except Exception as exc:
                  print(pkg, 'UNAVAILABLE', exc)
          " || true

      # Every test in tests/ builds its own synthetic fixtures in-process
      # (see tests/test_preprocess_split_aware.py, tests/test_pipeline.py) —
      # no multi-gigabyte GEO/TCGA downloads happen here.
      - name: Run test suite
        run: python -m pytest tests/ -q
