# configs/datasets.yaml — dataset manifest seed.
#
# Facts that don't depend on which files happen to be present in a given
# environment: accession, official record URL, species, assay type,
# identifier fields, and documented label limitations. src/data/manifest.py
# reads this file and fills in the parts that DO depend on the local
# filesystem (raw_file_checksums, files_present) to produce the full
# manifest at data/processed/dataset_manifest.json.
#
# raw_subdir mirrors src/data/downloaders.py's GEO_DATASETS/TCGA_DATASETS
# registry subdirectories exactly — this file does not duplicate download
# logic, only the provenance facts a manifest needs to describe a dataset
# whether or not it has actually been downloaded in this environment.
#
# Every fact below that could not be independently re-verified via network
# access in this environment is carried over from this repository's
# existing, already-reviewed provenance documentation (converters.py /
# downloaders.py docstrings, README.md's "Where the data comes from"
# section) — see README.md's dataset-status table for the explicit
# implemented / adapter-only / controlled-access-blocked breakdown.

datasets:
  - dataset_id: gse136831
    accession: GSE136831
    raw_subdir: cigarette/GSE136831
    source_url: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE136nnn/GSE136831/
    official_record_url: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE136831
    publication_reference: "Habermann et al., Sci Adv 2020 (Vanderbilt/interstitial lung disease atlas)"
    species: human
    genome_build: GRCh38
    gene_identifier_type: gene_symbol
    assay_type: single_cell_rna_seq
    matrix_representation: sparse_mtx_triplet
    subject_identifier_field: Subject_Identity
    sample_identifier_field: Sample_Identity
    cell_identifier_field: CellBarcode_Identity
    smoke_metadata_fields: []
    cancer_metadata_fields: []
    malignancy_metadata_fields: []
    label_policy_version: "1"
    license_or_access_level: public_geo
    controlled_access: false
    synthetic_or_real: real
    raw_file_names:
      - GSE136831_RawCounts_Sparse.mtx.gz
      - GSE136831_AllCells.GeneIDs.txt.gz
      - GSE136831_AllCells.cellBarcodes.txt.gz
      - GSE136831_AllCells.Samples.CellType.MetadataTable.txt.gz
    known_limitations:
      - "This accession is the Vanderbilt/Habermann interstitial lung disease atlas (COPD/IPF/Control), not a dedicated smoking cohort — it has no verified per-subject cigarette-exposure field."
      - "Disease_Identity=COPD is used only as a documented weak proxy for cigarette exposure (smoke_label_method=weak_proxy, confidence=low) when data.weak_labels.enabled=true; it is never the default verified smoke_type source."

  - dataset_id: gse288003
    accession: GSE288003
    raw_subdir: vape/GSE288003
    source_url: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE288nnn/GSE288003/
    official_record_url: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE288003
    publication_reference: null
    species: mouse
    genome_build: GRCm39
    gene_identifier_type: gene_symbol
    assay_type: single_cell_rna_seq
    matrix_representation: sparse_mtx_10x_triplet
    subject_identifier_field: donor_id
    sample_identifier_field: GSM_id
    cell_identifier_field: barcode
    smoke_metadata_fields: [condition]
    cancer_metadata_fields: []
    malignancy_metadata_fields: []
    label_policy_version: "1"
    license_or_access_level: public_geo
    controlled_access: false
    synthetic_or_real: real
    raw_file_names: []  # per-GSM 10x triples extracted from *_RAW.tar; filenames vary per sample, see downloaders.py::_extract_tar
    known_limitations:
      - "Mouse data — never merged with human sources except under an explicit cross-species experiment_mode (see src/data/species_policy.py); default experiment_mode=human_only excludes it entirely."
      - "smoke_type per cell comes from the real per-GSM condition (Con/E-cigs) recorded in the sample filename, not an accession-level blanket default."
      - "Ortholog mapping to human gene symbols is lossy (unmapped/ambiguous genes are dropped) — see src/data/ortholog.py."

