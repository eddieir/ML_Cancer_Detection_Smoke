    gene_identifier_type: ensembl_gene_id
    assay_type: bulk_rna_seq
    matrix_representation: bulk_samples_x_genes
    subject_identifier_field: case_id
    sample_identifier_field: file_id
    cell_identifier_field: null
    smoke_metadata_fields: []
    cancer_metadata_fields: [sample_type, primary_diagnosis]
    malignancy_metadata_fields: [sample_type]
    label_policy_version: "1"
    license_or_access_level: public_open_gdc
    controlled_access: false
    synthetic_or_real: real
    raw_file_names: []
    known_limitations:
      - "Same TCGA bulk/smoking limitations as TCGA-LUAD above."

  - dataset_id: nlst
    accession: NLST
    raw_subdir: subjects/NLST
    source_url: https://cdas.cancer.gov/nlst/
    official_record_url: https://cdas.cancer.gov/nlst/
    publication_reference: "National Lung Screening Trial Research Team, NEJM 2011"
    species: human
    genome_build: null
    gene_identifier_type: null
    assay_type: clinical_tabular
    matrix_representation: subject_level_csv
    subject_identifier_field: pid
    sample_identifier_field: null
    cell_identifier_field: null
    smoke_metadata_fields: [CIGSMOK, CIGAR]
    cancer_metadata_fields: [candx]
    malignancy_metadata_fields: []
    label_policy_version: "1"
    license_or_access_level: controlled_access_dua_required
    controlled_access: true
    synthetic_or_real: real
    raw_file_names:
      - screen.csv
      - prsn.csv
    known_limitations:
      - "Controlled access — requires an approved NCI Data Use Agreement. Not accessed in this environment; see src/data/downloaders.py::print_nlst_instructions for the exact authorized-access steps."
      - "No participant-level NLST data is committed to this repository under any circumstance; only a schema-compatible synthetic fixture is used for CI."
