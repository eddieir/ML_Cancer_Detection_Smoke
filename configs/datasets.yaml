    accession: GSE123352
    raw_subdir: cigarette/GSE123352
    source_url: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE123nnn/GSE123352/
    official_record_url: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE123352
    publication_reference: null
    species: human
    genome_build: null
    gene_identifier_type: illumina_probe_id_ILMN
    assay_type: bulk_microarray
    matrix_representation: pseudo_bulk_samples_x_genes
    subject_identifier_field: sample_id
    sample_identifier_field: sample_id
    cell_identifier_field: null
    smoke_metadata_fields: [ever_never_smoker]
    cancer_metadata_fields: []
    malignancy_metadata_fields: []
    label_policy_version: "1"
    license_or_access_level: public_geo
    controlled_access: false
    synthetic_or_real: real
    raw_file_names:
