      - GPL10558.annot.gz
    known_limitations:
      - "176 subjects, ever/never-smoker status per series metadata — treated as accession-provided sample-level metadata, not independently re-verified in this environment (no network access to GEO during this change)."

  - dataset_id: gse307690_canuck
    accession: GSE307690
    raw_subdir: cannabis/GSE307690
    source_url: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE307nnn/GSE307690/
    official_record_url: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE307690
    publication_reference: "CANUCK study (Halayko/Tam et al.) — human airway epithelium, cannabis exposure"
    species: human
    genome_build: null
    gene_identifier_type: gene_symbol
    assay_type: bulk_microarray_or_rnaseq
    matrix_representation: pseudo_bulk_samples_x_genes
    subject_identifier_field: sample_id
    sample_identifier_field: sample_id
    cell_identifier_field: null
    smoke_metadata_fields: [cannabis_never_smoker]
    cancer_metadata_fields: []
    malignancy_metadata_fields: []
    label_policy_version: "1"
    license_or_access_level: public_geo
    controlled_access: false
    synthetic_or_real: real
    raw_file_names:
      - GSE307690_series_matrix.txt.gz
      - GSE307690_processed_data.txt.gz
    known_limitations:
      - "139 cannabis smokers + 57 never-smokers per accession description (existing repository documentation) — not independently re-verified in this environment; sample-level completeness must be confirmed by the deterministic completeness report (src/data/completeness.py) at conversion time, not assumed from the accession description."

  - dataset_id: tcga_luad
    accession: TCGA-LUAD
    raw_subdir: malignancy/TCGA-LUAD
    source_url: https://api.gdc.cancer.gov/
    official_record_url: https://portal.gdc.cancer.gov/projects/TCGA-LUAD
    publication_reference: "TCGA Research Network — LUAD"
    species: human
    genome_build: GRCh38
    gene_identifier_type: ensembl_gene_id
    assay_type: bulk_rna_seq
    matrix_representation: bulk_samples_x_genes
    subject_identifier_field: case_id
    sample_identifier_field: file_id
    cell_identifier_field: null
    smoke_metadata_fields: []
    cancer_metadata_fields: [sample_type, primary_diagnosis]
    malignancy_metadata_fields: [sample_type]
    label_policy_version: "1"
    license_or_access_level: public_open_gdc
    controlled_access: false
    synthetic_or_real: real
    raw_file_names: []  # per-case HTSeq/STAR count files, one per GDC file_id — see downloaders.py::download_tcga
    known_limitations:
      - "TCGA does not carry verified per-patient smoking history in this pipeline — smoke_type is never defaulted to cigarette for TCGA samples; see data.tcga.mode=bulk gate (assay_mode=bulk_tcga) that keeps this out of the single-cell training loader."
      - "sample_type (tumor vs. solid-tissue-normal) supports a bulk tumor/normal label only within the explicit bulk_tcga experiment mode; it does not provide per-cell malignancy labels for unrelated single-cell datasets."
      - "Primarily bulk RNA-seq, not single-cell — never combined with single-cell sources except through the explicit bulk_tcga assay mode."

  - dataset_id: tcga_lusc
    accession: TCGA-LUSC
    raw_subdir: malignancy/TCGA-LUSC
    source_url: https://api.gdc.cancer.gov/
    official_record_url: https://portal.gdc.cancer.gov/projects/TCGA-LUSC
    publication_reference: "TCGA Research Network — LUSC"
