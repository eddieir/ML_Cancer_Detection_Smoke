data:
  # Governs cross-species (human/mouse) mode gating — see
  # src/data/species_policy.py, src/constants.py. Default is human_only:
  # the mouse source below (gse288003_path) is NOT loaded unless this is
  # changed explicitly. One of: human_only | mouse_only |
  # cross_species_pretraining | cross_species_domain_adaptation.
  experiment_mode: human_only
  # Experiment-level assay gate — see src/data/assay_policy.py,
  # src/constants.py. single_cell_only (the default) accepts real
  # single-cell rows only and rejects every obs["is_pseudo_bulk"]=True row
  # regardless of which source/config list it came from — see
  # src/preprocess.py::_load_all_sources. One of: single_cell_only |
  # bulk_only | multimodal (multimodal is not implemented — requesting it
  # raises MultimodalTrainingNotImplementedError, see assay_policy.py).
  assay_policy: single_cell_only
  # Machine-readable dataset provenance/checksum manifest — see
  # src/data/manifest.py and README.md's dataset-status table.
  dataset_manifest: configs/datasets.yaml
  # verified_only (default): only smoke_label rows with a verified,
  # non-weak-proxy source contribute to smoke-type supervision/metrics.
  # weak_labels.enabled must be explicitly set true to opt a documented
  # weak proxy (e.g. GSE136831's COPD-diagnosis proxy) into training — see
  # README.md's COPD-proxy policy section.
  label_policy: verified_only
  weak_labels:
    enabled: false
  species:
    evaluation_species: human
    mouse_usage: disabled
    ortholog_mapping:
      source: ensembl
      policy: one_to_one_only
      artifact: null
  tcga:
    enabled: false
    mode: bulk
    projects: [TCGA-LUAD, TCGA-LUSC]
    manifest_path: null
    # TCGA bulk expression CSVs (data/converters.py::convert_tcga output) —
    # deliberately NOT part of scrna_sources/microarray_sources below.
    # is_pseudo_bulk=True rows must never enter the single-cell pipeline
    # (see src/data/assay_policy.py, src/preprocess.py::_load_all_sources,
    # src/preprocess.py::load_tcga_bulk_dataset).
    # data.tcga.enabled stays false by default — real bulk training is not
    # implemented; enabling this only unlocks the dedicated bulk manifest/
    # validation/loading path, with an actionable error if a caller then
    # tries to actually train against it.
    bulk_sources:
      - [data/processed/converted/TCGA-LUAD.csv, TCGA-LUAD]
      - [data/processed/converted/TCGA-LUSC.csv, TCGA-LUSC]
  # Bulk microarray/RNA-seq sources represented as one-row-per-sample
  # "pseudo-cells" (data/loaders.py::load_microarray, is_pseudo_bulk=True).
  # These are NOT single-cell data and must never be loaded into the
  # default single-cell training pipeline (data.scrna_sources/
  # data.microarray_sources above) — see GitHub issue #13. Kept here,
  # disabled, purely as a dataset manifest/download/conversion record; no
  # bulk training pipeline exists (see src/data/assay_policy.py::
  # BulkTrainingNotImplementedError). data.bulk_sources.enabled stays false
  # by default; even if a caller flips it on and loads these CSVs directly,
  # data.assay_policy=single_cell_only still rejects them the moment they
  # reach _load_all_sources/merge_sources/export_cell_dataset — moving them
  # here is defense in depth, not the only enforcement point.
  bulk_sources:
    enabled: false
    datasets:
      - [data/processed/converted/GSE994.csv, cigarette, GSE994]
      - [data/processed/converted/GSE123352.csv, cigarette, GSE123352]
      - [data/processed/converted/GSE307690.csv, cannabis, CANUCK]
  nlst:
    enabled: false
    local_root_env: NLST_DATA_ROOT
    manifest_path: null
  # Populated by:
  #   python3 src/data/downloaders.py --all
  #   python3 src/data/converters.py --all
  # A source is silently skipped by run_pipeline() if its file doesn't exist
  # yet, so this is safe to check in with real paths even before download.
  scrna_sources:
    # smoke_type here is only the fallback used if the converter had NOT
    # already stamped a per-cell smoke_type_name — for GSE136831 it always
    # has (every cell gets "unknown" + smoke_type_known=False; see
    # data/converters.py::_load_gse136831_cell_metadata), so this value is
    # never actually applied. Kept as "unknown" rather than "cigarette" so
    # this line cannot be misread as a real label.
    - [data/processed/converted/GSE136831.h5ad, unknown, donor_id]
  # Empty by default: GSE994, GSE123352, and GSE307690/CANUCK are bulk
  # microarray/RNA-seq (is_pseudo_bulk=True pseudo-cells), not single-cell
  # data, and must never be merged into the same matrix as scrna_sources
  # above — see data.bulk_sources for their (disabled-by-default) dataset
  # manifest entry, and GitHub issue #13 for why they were removed from
  # here. TCGA-LUAD/TCGA-LUSC were never listed here either — see
  # data.tcga.bulk_sources. Even a config that re-adds an is_pseudo_bulk=True
  # source to this list is still rejected by the row-level assay-policy
  # check in src/preprocess.py::_load_all_sources — this list being empty
  # is a defense-in-depth default, not the only enforcement point.
  microarray_sources: []
  gse288003_path: data/processed/converted/GSE288003.h5ad
  nlst_csv: data/raw/subjects/NLST/screen.csv
  nlst_outcomes_csv: data/processed/converted/nlst_outcomes.csv
  # TCGA outcome CSVs carry only subject_id + cancer_label (tumor/normal ->
  # a subject-level cancer outcome) for MIL-bag supervision — this is
  # subject-level metadata, never TCGA's bulk expression matrix itself, so
  # it does not cross the bulk/single-cell boundary the way microarray_
  # sources would.
  extra_outcomes_csvs:
    - data/processed/converted/TCGA-LUAD_outcomes.csv
    - data/processed/converted/TCGA-LUSC_outcomes.csv
  tumor_barcodes: null
  n_hvgs: 2000
  min_cells_per_subject: 50
  out_dir: data/processed

split:
  # Subject-level split — a subject's cells/samples always land in exactly
  # one split (src/data/splitting.py). Never split by cell.
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 42
  manifest_path: data/processed/split_manifest.json
  n_folds: 5  # grouped_kfold; reduced automatically when a class has fewer subjects

rare_class:
  # Policy for smoke-type classes with too few independent subjects to learn
  # or evaluate reliably (e.g. cigar, currently ~1 subject in the real data).
  # One of: keep_with_warning | merge_into_dual_use_or_other | exclude_from_training_and_evaluation
  # Actually applied by preprocess.py::run_pipeline_split_aware (before the
  # subject-level split, on the FINAL effective label) — not just an
  # available-but-unused utility.
  policy: merge_into_dual_use_or_other
  min_subjects_required: 3
  target_classes: [cigar]

preprocessing:
  # Enforced structurally by preprocess.py::run_pipeline_split_aware (split
  # happens before fit_preprocessing is ever called) — this flag documents
  # the invariant rather than switching behavior; see data/preprocessing.py.
  split_before_fit: true
  hvg:
    fit_partition: train
    n_top_genes: 2000
  scaling:
    fit_partition: train
    zero_variance_policy: unit_scale
  # Gene-contract policies enforced by data/preprocessing.py::verify_compatible
  # against every validation/test/inference input transformed with a fitted
  # PreprocessingArtifact — see PreprocessingArtifact.missing_gene_policy etc.
  # and tests/test_config_consistency.py, which fails the build if these
  # ever drift from data/preprocessing.py's DEFAULT_* constants.
  missing_gene_policy: error
  # No aggregation policy is implemented for a duplicate gene identifier —
  # 'error' is the only supported value.
  duplicate_gene_policy: error
  # 'ignore' (default): a gene present in the input but not in the
  # artifact's selected panel is recorded in compatibility diagnostics but
  # does not block the transform. 'error' rejects it outright.
  unexpected_gene_policy: ignore
  # Fraction (0, 1] of the artifact's selected gene panel that must be
  # present in an input before it is transformed at all.
  minimum_gene_coverage: 1.0
  batch_correction:
    method: harmony
    # mode: none (default) | train_fitted_inductive | transductive_diagnostic_only
    # Harmony (this project's only implemented method) has no train-only-fit
    # / apply-to-new-data mode, so "train_fitted_inductive" is not currently
    # available — requesting it fails clearly rather than silently running
    # the transductive path. "transductive_diagnostic_only" is the
    # explicitly-named opt-in for the legacy allow_transductive_harmony
    # behavior below; it must never be used for frozen-test evaluation (see
    # src/benchmarks/test_guard.py) and results produced under it must not
    # be described as leakage-free.
    mode: none
    # Legacy flag, kept for backward compatibility: true is equivalent to
    # mode: transductive_diagnostic_only. Harmony has no train-only-fit /
    # apply-to-new-data mode, so running it uses held-out (val/test)
    # expression values to compute the batch correction embedding — a
    # transductive, NOT leakage-free, step. Default is strict: batch
    # correction is SKIPPED in run_pipeline_split_aware. Set true only as a
    # deliberate, documented opt-in — the resulting experiment must not be
    # described as fully leakage-free.
    allow_transductive_harmony: false

model:
  input_dim: 2000
  embedding_dim: 256
  num_smoke_types: 6
  num_cell_types: 4
  encoder_dropout: 0.3
  head_dropout: 0.2
  attention_dim: 128

  # Phase 5 — pathway-aware hierarchical MIL (src/pathway_hierarchical_mil.py).
  # A research-candidate architecture, disabled by default. Enabling it does
  # not change MultiSmokeCancerNet's behavior in any way; the two models are
  # selected explicitly and never mixed within one run.
  pathway_hierarchical_mil:
    enabled: false
    embedding_dim: 128
    residual_gene_dim: 64
    attention_dim: 64
    dropout: 0.2
    use_gene_residual: true
    use_cell_type_embedding: true
    cell_type_embedding_dim: 16
    use_source_embedding: false
    source_embedding_dim: 8
    use_species_embedding: false
    species_embedding_dim: 4
    smoke_loss_weight: 1.0
    cancer_loss_weight: 1.0
    return_attention_during_training: false
    num_cell_type_buckets: 5
    num_sources: 1
    num_species: 2
    empty_batch_policy: skip
    uncertainty:
      mc_dropout_enabled: false
      mc_passes: 20
    # Gene modules define the masked gene-to-module projection this model
    # depends on (see GeneModuleCollection). No pathway resource is
    # downloaded automatically and none is committed to this repository.
    # path: null with allow_synthetic_modules: true is only valid for
    # synthetic/test workflows — a real training run requires a supplied
    # GMT-format module file, or the model fails to construct with an
    # actionable configuration error.
    gene_modules:
      path: null
      format: gmt
      identifier_namespace: gene_symbol
      minimum_genes_per_module: 3
      minimum_module_coverage: 0.5
      empty_module_policy: error
      allow_synthetic_modules: false

benchmarks:
  # Phase 6 — source-held-out domain robustness evaluation and optional
  # development-only domain-robust training strategies for
  # pathway_hierarchical_mil (src/benchmarks/domain_losses.py,
  # source_held_out.py). This is entirely separate from the frozen final
  # test split (data.split / preprocessing.batch_correction above,
  # src/benchmarks/test_guard.py): source-held-out evaluation only ever
  # touches train+val-pool subjects and never acquires the frozen-test
  # guard. Disabled/ERM by default — enabling this changes evaluation
  # reporting and (optionally) training-time regularization, never the
  # frozen-test protocol itself.
  domain_robustness:
    enabled: false
    strategy: erm  # erm | source_balanced | coral | mmd | domain_adversarial
    outer_protocol: leave_one_source_out
    inner_protocol: source_aware
    minimum_subjects_per_source: 3
    minimum_classes_per_source: 2
    report_worst_source: true
    source_balancing:
      enabled: false
    coral:
      enabled: false
      weight: 0.0
    mmd:
      enabled: false
      weight: 0.0
      kernel: rbf
    adversarial:
      enabled: false
      weight: 0.0
      warmup_epochs: 0
      gradient_reversal_lambda: 0.0
    uncertainty:
      enabled: true
      abstention_analysis: false
    biological_stability:
      enabled: true
      top_k: 10
      permutation_runs: 20

train:
  phase1_epochs: 15
  phase1_lr: 1.0e-3
  phase1_batch_size: 512
  lambda_dose: 0.10  # weight of the dose-response loss during Phase 1 (see model.py DoseResponseHead)
  phase2_epochs: 12
  phase2_lr: 5.0e-4
  phase3_epochs: 8
  phase3_lr: 1.0e-4
  patience: 5
  grad_clip: 1.0
  checkpoint_dir: checkpoints

  # Phase 2 — subject-aware class-imbalance correction (src/data/sampling.py,
  # model.py's FocalLoss). Every key below is optional; omitting this whole
  # section (or any individual key) resolves to the explicit backward-
  # compatible defaults in data/sampling.py::DEFAULT_SMOKE_IMBALANCE_CONFIG,
  # which reproduce pre-Phase-2 behaviour exactly (DataLoader(shuffle=True),
  # auto train-only inverse-frequency class weights, plain cross-entropy).
  smoke_imbalance:
    # "shuffle" (pre-Phase-2 default) | "subject_balanced" (class -> subject
    # -> cell sampling — a subject's cell count never affects its own
    # selection probability; see data/sampling.py's module docstring).
    # Stays "shuffle" here deliberately: no real (non-synthetic) held-out
    # comparison has established that subject_balanced (or any other
    # strategy) outperforms this default — see benchmarks/imbalance_ablation.py,
    # which exists to produce that development-only evidence but has not
    # yet been run against real data. Switching this default requires real
    # development-only evidence, never a frozen-test result and never the
    # mere existence of the subject_balanced sampler. subject_balanced is a
    # supported, tested, but experimental/opt-in configuration until then.
    sampler: shuffle
    # Only used when sampler=subject_balanced.
    # "uniform" (equal probability per observed effective class, default),
    # "natural" (proportional to unique-subject count per class), or
    # "inverse_subject_frequency" (proportional to 1 / unique-subject count).
    class_selection: uniform
    # Only "uniform" is currently implemented: within a selected class,
    # every unique subject has equal selection probability regardless of
    # its cell count.
    subject_selection: uniform
    # Exactly one of these may be set (both null uses one batch per
    # ceil(n_train_cells / batch_size), matching a normal epoch's length).
    batches_per_epoch: null
    samples_per_epoch: null
    # Maximum cells drawn from any one subject within a single batch. Null
    # (the backward-compatible default — must match
    # data/sampling.py::DEFAULT_SMOKE_IMBALANCE_CONFIG exactly) means
    # unbounded: a very-high-cell-count subject can still fill a batch,
    # subject only to the subject-selection draw itself. A concrete cap
    # (e.g. 8, as used by benchmarks/imbalance_ablation.py's
    # subject_balanced_* strategies) is a hard per-batch ceiling once set —
    # see data/sampling.py's SubjectBalancedBatchSampler docstring.
    cells_per_subject_per_batch: null
    # Whether a cell may be drawn more than once from the same subject
    # within one batch. replacement=false requires cells_per_subject_per_batch
    # to be set and requires every subject to have at least that many cells.
    replacement: true
    # "none" | "inverse_frequency" (pre-Phase-2 default — train-only
    # inverse-frequency CrossEntropyLoss weights, computed per
    # CellLevelDataset.smoke_class_weights).
    class_weighting: inverse_frequency
    # "cross_entropy" (default) | "focal" (model.py's FocalLoss — a
    # configurable ablation, not an unconditional replacement).
    loss: cross_entropy
    # Only used when loss=focal. Must be >= 0; gamma=0 is equivalent to
    # plain (optionally class-weighted) cross-entropy.
    focal_gamma: 2.0
    # Only used when loss=focal. "class_weights" applies class_weighting's
    # resolved weights as focal's alpha term (default). "none" runs focal
    # loss unweighted — use this to avoid double-correcting when
    # class_weighting=inverse_frequency AND sampler=subject_balanced are
    # both active (see README.md's imbalance-ablation section).
    focal_alpha_mode: class_weights
    # Added to the Trainer's seed when constructing the subject-balanced
    # sampler's RNG, so a multi-seed benchmark loop (same base seed,
    # different imbalance ablations) draws independent sampling sequences
    # instead of accidentally sharing one.
    seed_offset: 0