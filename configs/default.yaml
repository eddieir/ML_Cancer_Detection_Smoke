  phase1_lr: 1.0e-3
  phase1_batch_size: 512
  phase2_epochs: 12
  phase2_lr: 5.0e-4
  phase3_epochs: 8
  phase3_lr: 1.0e-4
  patience: 5
  grad_clip: 1.0
  checkpoint_dir: checkpoints