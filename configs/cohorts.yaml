    verified_smoke_label_fields: []
    weak_smoke_label_fields: []
    malignancy_label_fields: [sample_type]
    cancer_outcome_fields: [sample_type, primary_diagnosis]
    outcome_time_horizon: null
    censoring_fields: []
    expression_outcome_linkable_at_subject_level: false
    source_limitations:
      - "Same TCGA bulk/smoking/single-cell limitations as tcga_luad."
    licensing_access_limitations: "Public open GDC access, no DUA required."
    checksum_rule: "sha256 of per-case HTSeq/STAR count files; see src/data/downloaders.py::download_tcga."
    task_support:
      smoke_classification: "no"
      malignancy_classification: not_currently
      subject_level_cancer_prediction: "no"
      external_validation: "no"
    role_eligibility: [excluded]
    notes:
      - "Never treated as single-cell data; never enters per-cell malignancy training."

  - cohort_id: nlst
    accession: NLST
    dataset_id: nlst
    version_or_retrieval_date: "controlled-access, not retrieved in this environment"
    access_level: controlled
    species: human
    assay_type: clinical_tabular
    single_cell_or_bulk: not_applicable
    biological_tissue: not_applicable
    subject_identifier_field: pid
    sample_identifier_field: null
    cell_identifier_field: null
    verified_smoke_label_fields: [CIGSMOK, CIGAR]
    weak_smoke_label_fields: []
    malignancy_label_fields: []
    cancer_outcome_fields: [candx]
    outcome_time_horizon: null   # not established without the actual DUA-governed dataset and its documented follow-up schedule
    censoring_fields: []
    expression_outcome_linkable_at_subject_level: false
    source_limitations:
      - "Controlled access — requires an approved NCI Data Use Agreement (checked via NLST_DATA_ROOT env var, see src/data/nlst_adapter.py::check_nlst_availability). Not accessed in this environment."
      - "Missing diagnosis/outcome (candx) stays unknown — never converted to a negative outcome."
      - "Smoke-history fields (CIGSMOK/CIGAR) alone do not provide expression input — NLST is clinical/tabular, not single-cell/bulk expression data."
      - "Subject-level cancer prediction with this cohort requires a genuine linkage between eligible expression data and NLST outcomes; no such linkage exists in this repository and none is fabricated."
      - "No participant-level NLST data is committed to this repository under any circumstance."
    licensing_access_limitations: "Controlled access, DUA required; see src/data/downloaders.py::print_nlst_instructions."
    checksum_rule: "sha256 of screen.csv/prsn.csv only if NLST_DATA_ROOT points at an authorized local copy; never computed or committed otherwise."
    task_support:
      smoke_classification: "no"          # no expression input at all
      malignancy_classification: "no"
      subject_level_cancer_prediction: not_currently   # blocked on authorized access + genuine expression/outcome linkage, neither of which exists here
      external_validation: "no"
    role_eligibility: [excluded]
    notes:
      - "If linkage is absent (the expected case without an authorized local dataset), state that explicitly rather than fabricating it."
