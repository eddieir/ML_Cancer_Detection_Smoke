    biological_tissue: airway_epithelium
    subject_identifier_field: sample_id
    sample_identifier_field: sample_id
    cell_identifier_field: null
    verified_smoke_label_fields: [cannabis_never_smoker]
    weak_smoke_label_fields: []
    malignancy_label_fields: []
    cancer_outcome_fields: []
    outcome_time_horizon: null
    censoring_fields: []
    expression_outcome_linkable_at_subject_level: false
    source_limitations:
      - "Bulk/pseudo-bulk — must not enter single-cell MIL."
      - "No genuinely supported bulk pipeline currently exists in this repository."
    licensing_access_limitations: "Public GEO series, no DUA required."
    checksum_rule: "sha256 of series-matrix + processed-data files under raw_subdir."
    task_support:
      smoke_classification: not_currently
      malignancy_classification: "no"
      subject_level_cancer_prediction: "no"
      external_validation: "no"
    role_eligibility: [excluded]
