      - "Recorded as unavailable for Phase 7 single-cell MIL evidence; historical mixed-assay results involving this cohort are not resurrected."

  - cohort_id: tcga_luad
    accession: TCGA-LUAD
    dataset_id: tcga_luad
    version_or_retrieval_date: "GDC open API, not re-fetched in this environment"
    access_level: public
    species: human
    assay_type: bulk_rna_seq
    single_cell_or_bulk: bulk
    biological_tissue: lung
    subject_identifier_field: case_id
    sample_identifier_field: file_id
    cell_identifier_field: null
    verified_smoke_label_fields: []
    weak_smoke_label_fields: []
    malignancy_label_fields: [sample_type]
    cancer_outcome_fields: [sample_type, primary_diagnosis]
    outcome_time_horizon: null
    censoring_fields: []
    expression_outcome_linkable_at_subject_level: false
    source_limitations:
      - "Bulk RNA-seq — tumour/normal status (sample_type) may support a bulk malignancy task only, never single-cell per-cell malignancy labels."
      - "Does not provide verified smoke type by default; smoke_type is never defaulted to cigarette for TCGA samples."
      - "Cannot validate the single-cell MIL model without a scientifically defined cross-assay model; none exists in this repository, so cross-assay validation must return not_evaluable rather than implicitly adapting the single-cell model."
    licensing_access_limitations: "Public open GDC access, no DUA required."
    checksum_rule: "sha256 of per-case HTSeq/STAR count files; see src/data/downloaders.py::download_tcga."
    task_support:
      smoke_classification: "no"
      malignancy_classification: not_currently   # would require a genuinely supported bulk pipeline, which does not currently exist
      subject_level_cancer_prediction: "no"
      external_validation: "no"
    role_eligibility: [excluded]
    notes:
      - "Never treated as single-cell data; never enters per-cell malignancy training."

  - cohort_id: tcga_lusc
    accession: TCGA-LUSC
    dataset_id: tcga_lusc
    version_or_retrieval_date: "GDC open API, not re-fetched in this environment"
    access_level: public
    species: human
    assay_type: bulk_rna_seq
    single_cell_or_bulk: bulk
    biological_tissue: lung
