# configs/cohorts.yaml — Phase 7 canonical cohort and endpoint registry.
#
# Extends configs/datasets.yaml (which records raw provenance/checksum
# facts) with the Phase 7 evidence-eligibility facts: which tasks a cohort
# can support, in which role, and the specific known constraints that must
# never be silently bypassed. src/evidence/cohort_registry.py loads and
# validates this file, and cross-checks it against configs/datasets.yaml
# for accession/species contradictions.
#
# task_support values: "yes" | "no" | "not_currently" (adapter/pipeline
# support does not exist yet in this repository, independent of whether
# the data itself could in principle support it).

cohorts:
  - cohort_id: gse136831
    accession: GSE136831
    dataset_id: gse136831            # cross-reference into configs/datasets.yaml
    version_or_retrieval_date: "GEO series, not re-fetched in this environment"
    access_level: public
    species: human
    assay_type: single_cell_rna_seq
    single_cell_or_bulk: single_cell
    biological_tissue: lung
    subject_identifier_field: Subject_Identity
    sample_identifier_field: Sample_Identity
    cell_identifier_field: CellBarcode_Identity
    verified_smoke_label_fields: []
    weak_smoke_label_fields: [Disease_Identity]
    malignancy_label_fields: []
    cancer_outcome_fields: []
    outcome_time_horizon: null
    censoring_fields: []
    expression_outcome_linkable_at_subject_level: false
    source_limitations:
      - "Vanderbilt/Habermann interstitial lung disease atlas (COPD/IPF/Control) — real per-donor cells/subject IDs, but no verified per-subject cigarette-exposure field."
      - "Disease_Identity=COPD is a weak exposure proxy only (smoke_label_method=weak_proxy, confidence=low) — never used as a verified cigarette label."
      - "Cannot independently provide verified cancer outcomes."
    licensing_access_limitations: "Public GEO series, no DUA required."
    checksum_rule: "sha256 of each raw_file_names entry under raw_subdir, per src/data/manifest.py."
    task_support:
      smoke_classification: not_currently   # unknown labels excluded from supervised smoke metrics by default; weak-label experiment is a separate, explicitly enabled, separately reported path
      malignancy_classification: "no"
      subject_level_cancer_prediction: "no"
      external_validation: "no"
    role_eligibility: [development]
    notes:
      - "Unknown smoke labels are excluded from supervised smoke metrics unless an explicitly enabled weak-label experiment is run, and that experiment's results are reported separately and never merged with primary verified-label results."

  - cohort_id: gse288003
    accession: GSE288003
    dataset_id: gse288003
    version_or_retrieval_date: "GEO series, not re-fetched in this environment"
    access_level: public
    species: mouse
    assay_type: single_cell_rna_seq
    single_cell_or_bulk: single_cell
    biological_tissue: lung
    subject_identifier_field: donor_id
    sample_identifier_field: GSM_id
    cell_identifier_field: barcode
    verified_smoke_label_fields: [condition]
    weak_smoke_label_fields: []
    malignancy_label_fields: []
    cancer_outcome_fields: []
    outcome_time_horizon: null
    censoring_fields: []
    expression_outcome_linkable_at_subject_level: false
    source_limitations:
      - "Mouse data — must remain species-separated per src/data/species_policy.py; default experiment_mode=human_only excludes it entirely."
      - "Ortholog mapping to human gene symbols uses the existing versioned artifact (src/data/ortholog.py) and is lossy (unmapped/ambiguous genes dropped)."
      - "Is not human external validation under any circumstance; cannot be silently pooled into human evidence."
    licensing_access_limitations: "Public GEO series, no DUA required."
    checksum_rule: "sha256 of per-GSM 10x triples extracted from *_RAW.tar; see src/data/downloaders.py::_extract_tar."
    task_support:
      smoke_classification: not_currently   # mouse-only; would require an explicit cross-species domain-adaptation experiment, reported separately
      malignancy_classification: "no"
      subject_level_cancer_prediction: "no"
      external_validation: "no"
    role_eligibility: [excluded]
    notes:
      - "Any domain-adaptation result using this cohort must be reported separately and never described as human external validation."

  - cohort_id: gse123352
    accession: GSE123352
    dataset_id: gse123352
    version_or_retrieval_date: "GEO series, not re-fetched in this environment"
    access_level: public
    species: human
    assay_type: bulk_microarray
    single_cell_or_bulk: bulk
    biological_tissue: airway_epithelium
    subject_identifier_field: sample_id
    sample_identifier_field: sample_id
    cell_identifier_field: null
    verified_smoke_label_fields: [ever_never_smoker]
    weak_smoke_label_fields: []
    malignancy_label_fields: []
    cancer_outcome_fields: []
    outcome_time_horizon: null
    censoring_fields: []
    expression_outcome_linkable_at_subject_level: false
    source_limitations:
      - "Bulk/pseudo-bulk microarray — must not enter single-cell MIL."
      - "A minimal, independent bulk-classification pipeline now exists (src/data/bulk_pipeline.py) — a simple train-only-top-variance-gene logistic regression, deliberately not tied into the single-cell MIL pipeline in any way. It is a first honest bulk baseline, not a tuned or externally validated model."
      - "No frozen internal/external held-out guard has ever been acquired for this cohort/task — role_eligibility stays [development] only; a real run against this cohort can claim evidence_level='development_only_real_data' at most."
    licensing_access_limitations: "Public GEO series, no DUA required."
    checksum_rule: "sha256 of series-matrix + platform-annotation files under raw_subdir."
    task_support:
      smoke_classification: "yes"
      malignancy_classification: "no"
      subject_level_cancer_prediction: "no"
      external_validation: "no"
    role_eligibility: [development]
    notes:
      - "smoke_classification uses data/bulk_pipeline.py + evidence.tracks.run_track_a_on_real_verified_label_data — see scripts/run_gse123352_verified_label_evidence.py for the end-to-end real run this repository has actually executed."

  - cohort_id: gse307690_canuck
    accession: GSE307690
    dataset_id: gse307690_canuck
